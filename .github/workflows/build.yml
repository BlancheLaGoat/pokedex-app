# Construit l'exécutable Windows portable.
# - à chaque push : l'exe est disponible dans l'onglet Actions (artefact « Pokedex-windows »)
# - quand tu publies un tag v* (ex. v1.4.1) : l'exe est joint à la Release GitHub
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Pokedex-windows
          path: dist/*.exe
      - name: Joindre l'exe à la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
