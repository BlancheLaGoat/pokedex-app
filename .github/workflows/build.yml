# Publication automatique.
# À chaque envoi sur la branche main (Push origin dans GitHub Desktop) :
#  - si le numéro de "version" de package.json n'a pas encore de release, l'installeur est construit
#    et publié comme nouvelle release GitHub (vX.Y.Z) -> les applis installées se mettent à jour toutes seules ;
#  - sinon, l'installeur est seulement construit et disponible dans l'onglet Actions (test).
name: Build et publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Nouvelle version ?
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "La release v$V existe déjà : simple build."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "Nouvelle version v$V : publication."
          fi

      # Construit l'installeur + latest.yml (fichier lu par la mise à jour automatique), sans rien publier
      - name: Construire l'installeur
        run: npx electron-builder --win nsis --publish never

      # Crée le tag vX.Y.Z sur ce commit et la release, avec l'installeur, sa blockmap et latest.yml
      - name: Publier la release
        if: steps.ver.outputs.new == 'true'
        shell: bash
        run: |
          V=${{ steps.ver.outputs.version }}
          ls -la dist
          gh release create "v$V" \
            --target "$GITHUB_SHA" \
            --title "Pokédex v$V" \
            --notes "Mise à jour automatique : l'appli installée la téléchargera toute seule. Première installation : lancer Pokedex-Setup-$V.exe." \
            dist/Pokedex-Setup-$V.exe dist/Pokedex-Setup-$V.exe.blockmap dist/latest.yml

      - uses: actions/upload-artifact@v4
        with:
          name: Pokedex-Setup-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/latest.yml
