<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https://raw.githubusercontent.com https://archives.bulbagarden.net http://tshadowknight.com data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Pokédex</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <img class="brand-icon" src="icon.png" alt="">
        <div>
          <div class="brand-title">Pokédex</div>
          <div class="brand-sub" id="app-version">Suivi par jeu</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div id="update-bar" class="update-bar hidden"></div>
      <div class="side-foot">
        <button class="ghost" id="btn-export">Exporter</button>
        <button class="ghost" id="btn-import">Importer</button>
        <button class="ghost" id="btn-journal">Journal</button>
        <button class="ghost wide-btn" id="btn-gamesave" title="Lire une sauvegarde de jeu (équipe + boîtes PC) et cocher les Pokémon que tu possèdes">Importer une sauvegarde de jeu</button>
      </div>
    </aside>

    <main id="main">
      <header id="head">
        <div class="head-row">
          <div>
            <h1 id="title">Chargement…</h1>
            <div id="subtitle" class="muted"></div>
          </div>
          <div id="progress"></div>
        </div>
        <div id="banner" class="banner hidden"></div>
        <div class="tabs" id="tabs"></div>
        <div class="toolbar" id="toolbar">
          <input id="q" type="search" placeholder="Rechercher un nom, un numéro…" autocomplete="off">
          <select id="f-type"></select>
          <select id="f-gen"></select>
          <select id="f-cat"></select>
          <select id="f-obt"></select>
          <select id="f-stage"></select>
          <select id="f-status"></select>
        </div>
        <div class="chips" id="chips"></div>
        <div class="legend hidden" id="legend"></div>
      </header>
      <section id="content"></section>
    </main>

    <aside id="drawer" class="closed">
      <button class="close" id="drawer-close" title="Fermer">×</button>
      <div id="drawer-body"></div>
    </aside>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <script src="savereader.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
